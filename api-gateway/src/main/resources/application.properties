spring.application.name=api-gateway
spring.profiles.active=dev
spring.main.web-application-type=reactive

server.port=${API_GATEWAY_PORT}

jwt.secret=${JWT_SECRET}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.database=${REDIS_DATABASE}

carwash.security.session-prefix=${SESSION_PREFIX}
carwash.security.session-ttl-seconds=${SESSION_TTL_SECONDS}

carwash.rate-limit.auth-login.replenish-rate=${RATE_LIMIT_AUTH_LOGIN_REPLENISH}
carwash.rate-limit.auth-login.burst-capacity=${RATE_LIMIT_AUTH_LOGIN_BURST}
carwash.rate-limit.auth-login.requested-tokens=${RATE_LIMIT_AUTH_LOGIN_REQUESTED}
carwash.rate-limit.auth-register.replenish-rate=${RATE_LIMIT_AUTH_REGISTER_REPLENISH}
carwash.rate-limit.auth-register.burst-capacity=${RATE_LIMIT_AUTH_REGISTER_BURST}
carwash.rate-limit.auth-register.requested-tokens=${RATE_LIMIT_AUTH_REGISTER_REQUESTED}
carwash.rate-limit.auth-resend-verification.replenish-rate=${RATE_LIMIT_AUTH_RESEND_REPLENISH}
carwash.rate-limit.auth-resend-verification.burst-capacity=${RATE_LIMIT_AUTH_RESEND_BURST}
carwash.rate-limit.auth-resend-verification.requested-tokens=${RATE_LIMIT_AUTH_RESEND_REQUESTED}
carwash.rate-limit.slot-lock.replenish-rate=${RATE_LIMIT_SLOT_LOCK_REPLENISH}
carwash.rate-limit.slot-lock.burst-capacity=${RATE_LIMIT_SLOT_LOCK_BURST}
carwash.rate-limit.slot-lock.requested-tokens=${RATE_LIMIT_SLOT_LOCK_REQUESTED}
carwash.rate-limit.payment-initiate.replenish-rate=${RATE_LIMIT_PAYMENT_INITIATE_REPLENISH}
carwash.rate-limit.payment-initiate.burst-capacity=${RATE_LIMIT_PAYMENT_INITIATE_BURST}
carwash.rate-limit.payment-initiate.requested-tokens=${RATE_LIMIT_PAYMENT_INITIATE_REQUESTED}
carwash.rate-limit.payment-verify.replenish-rate=${RATE_LIMIT_PAYMENT_VERIFY_REPLENISH}
carwash.rate-limit.payment-verify.burst-capacity=${RATE_LIMIT_PAYMENT_VERIFY_BURST}
carwash.rate-limit.payment-verify.requested-tokens=${RATE_LIMIT_PAYMENT_VERIFY_REQUESTED}
carwash.rate-limit.default-user.replenish-rate=${RATE_LIMIT_DEFAULT_USER_REPLENISH}
carwash.rate-limit.default-user.burst-capacity=${RATE_LIMIT_DEFAULT_USER_BURST}
carwash.rate-limit.default-user.requested-tokens=${RATE_LIMIT_DEFAULT_USER_REQUESTED}

carwash.services.auth-url=${AUTH_SERVICE_URL}
carwash.services.customer-url=${CUSTOMER_SERVICE_URL}
carwash.services.washer-url=${WASHER_SERVICE_URL}
carwash.services.booking-url=${BOOKING_SERVICE_URL}
carwash.services.payment-url=${PAYMENT_SERVICE_URL}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}

resilience4j.circuitbreaker.configs.default.sliding-window-size=${GATEWAY_CB_WINDOW}
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=${GATEWAY_CB_MIN_CALLS}
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=${GATEWAY_CB_FAILURE_RATE}
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=${GATEWAY_CB_OPEN_WAIT}
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=${GATEWAY_CB_HALF_OPEN_CALLS}
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=${GATEWAY_CB_AUTO_HALF_OPEN}

resilience4j.circuitbreaker.instances.authService.base-config=default
resilience4j.circuitbreaker.instances.customerService.base-config=default
resilience4j.circuitbreaker.instances.washerService.base-config=default
resilience4j.circuitbreaker.instances.bookingService.base-config=default
resilience4j.circuitbreaker.instances.paymentService.base-config=default

resilience4j.timelimiter.configs.default.timeout-duration=${GATEWAY_TIMEOUT}
resilience4j.timelimiter.instances.authService.base-config=default
resilience4j.timelimiter.instances.customerService.base-config=default
resilience4j.timelimiter.instances.washerService.base-config=default
resilience4j.timelimiter.instances.bookingService.base-config=default
resilience4j.timelimiter.instances.paymentService.base-config=default

logging.level.org.springframework.cloud.gateway=${LOGGING_LEVEL_GATEWAY}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY}
