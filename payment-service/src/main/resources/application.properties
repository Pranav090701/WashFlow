spring.application.name=payment-service
spring.profiles.active=dev
server.port=${PAYMENT_SERVICE_PORT}

spring.datasource.url=${PAYMENT_DB_URL}
spring.datasource.username=${PAYMENT_DB_USERNAME}
spring.datasource.password=${PAYMENT_DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

spring.jpa.database-platform=${JPA_DATABASE_PLATFORM}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}

jwt.secret=${JWT_SECRET}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

carwash.events.exchange=${CARWASH_EVENTS_EXCHANGE}

booking.service.base-url=${BOOKING_SERVICE_URL}
carwash.internal.booking-confirmation-token=${BOOKING_CONFIRMATION_TOKEN}

razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

resilience4j.circuitbreaker.configs.default.sliding-window-size=${PAYMENT_CB_WINDOW}
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=${PAYMENT_CB_MIN_CALLS}
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=${PAYMENT_CB_FAILURE_RATE}
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=${PAYMENT_CB_OPEN_WAIT}
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=${PAYMENT_CB_HALF_OPEN_CALLS}
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=${PAYMENT_CB_AUTO_HALF_OPEN}

resilience4j.circuitbreaker.instances.paymentBookingQuote.base-config=default
resilience4j.circuitbreaker.instances.paymentBookingQuote.ignore-exceptions=${PAYMENT_BOOKING_QUOTE_CB_IGNORE_EXCEPTIONS}
resilience4j.circuitbreaker.instances.paymentBookingConfirm.base-config=default
resilience4j.circuitbreaker.instances.paymentRazorpayOrder.base-config=default

logging.level.root=${LOGGING_LEVEL_ROOT}
