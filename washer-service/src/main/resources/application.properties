spring.application.name=washer-service
spring.profiles.active=dev

server.port=${WASHER_SERVICE_PORT}

spring.datasource.url=${WASHER_DB_URL}
spring.datasource.username=${WASHER_DB_USERNAME}
spring.datasource.password=${WASHER_DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}
jwt.secret=${JWT_SECRET}

spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}
spring.redis.database=${REDIS_DATABASE}

# Optional: Hibernate & JPA
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM}
spring.jpa.show-sql=${JPA_SHOW_SQL}
# Hibernate DDL auto generation
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}

logging.level.root=${LOGGING_LEVEL_ROOT}

# Booking service base URL
booking.service.base-url=${BOOKING_SERVICE_URL}

# Circuit Breaker
resilience4j.circuitbreaker.instances.bookingService.slidingWindowSize=${BOOKING_CB_SLIDING_WINDOW_SIZE}
resilience4j.circuitbreaker.instances.bookingService.failureRateThreshold=${BOOKING_CB_FAILURE_RATE_THRESHOLD}
resilience4j.circuitbreaker.instances.bookingService.waitDurationInOpenState=${BOOKING_CB_WAIT_DURATION_IN_OPEN_STATE}

# Retry
resilience4j.retry.instances.bookingService.maxAttempts=${BOOKING_RETRY_MAX_ATTEMPTS}
resilience4j.retry.instances.bookingService.waitDuration=${BOOKING_RETRY_WAIT_DURATION}

spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE}

# Shared only between washer-service and booking-service for internal booking validation.
carwash.internal.booking-validation-token=${BOOKING_VALIDATION_TOKEN}
