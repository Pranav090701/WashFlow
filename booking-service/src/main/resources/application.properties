spring.application.name=booking-service
spring.profiles.active=dev
server.port=${BOOKING_SERVICE_PORT}

spring.datasource.url=${BOOKING_DB_URL}
spring.datasource.username=${BOOKING_DB_USERNAME}
spring.datasource.password=${BOOKING_DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME}

# Hibernate DDL auto generation
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}

# Redis default config (optional if using defaults)
spring.redis.host=${REDIS_HOST}
spring.redis.port=${REDIS_PORT}

# Washer service base URL
washer.service.base-url=${WASHER_SERVICE_URL}

# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.instances.washerService.slidingWindowSize=${WASHER_CB_SLIDING_WINDOW_SIZE}
resilience4j.circuitbreaker.instances.washerService.failureRateThreshold=${WASHER_CB_FAILURE_RATE_THRESHOLD}
resilience4j.circuitbreaker.instances.washerService.waitDurationInOpenState=${WASHER_CB_WAIT_DURATION_IN_OPEN_STATE}

# Retry config
resilience4j.retry.instances.washerService.maxAttempts=${WASHER_RETRY_MAX_ATTEMPTS}
resilience4j.retry.instances.washerService.waitDuration=${WASHER_RETRY_WAIT_DURATION}

spring.security.user.name=${SPRING_SECURITY_USER_NAME}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD}
jwt.secret=${JWT_SECRET}

# Shared only between washer-service and booking-service for internal booking validation.
carwash.internal.booking-validation-token=${BOOKING_VALIDATION_TOKEN}

# Shared only between payment-service and booking-service for internal booking confirmation.
carwash.internal.booking-confirmation-token=${BOOKING_CONFIRMATION_TOKEN}

carwash.pricing.standard-wash-amount=${STANDARD_WASH_AMOUNT}
carwash.pricing.currency=${PRICING_CURRENCY}
